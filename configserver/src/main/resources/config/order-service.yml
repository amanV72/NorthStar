server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order
    username: ${DB_USER:root}
    password: ${DB_PASS:password}

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update

  cloud:
    function:
      definition: inventoryFailed;paymentCreated;inventoryReverted;paymentSuccess
    stream:
      bindings:
        orderSuccess-out-0:
          destination: order-success
          content-type: application/json
        orderCreated-out-0:
          destination: order-created
          content-type: application/json
        inventoryFailed-in-0:
          destination: inventory-failed
          group: order-service-group
          content-type: application/json
        paymentCreated-in-0:
          destination: payment-created
          group: order-service-group
          content-type: application/json
        inventoryReverted-in-0:
          destination: inventory-reverted
          group: order-service-group
          content-type: application/json
        paymentSuccess-in-0:
          destination: payment-success
          group: order-service-group
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092

app:
  message: "Hello order"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7

resilience4j:
  circuitbreaker:
    instances:
      productService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: count_based

  retry:
    instances:
      retryBreaker:
        maxAttempts: 5
        waitDuration: 500ms

  ratelimiter:
    instances:
      rateBreaker:
        timeout-duration: 0
        limit-refresh-period: 4s
        limit-for-period: 2

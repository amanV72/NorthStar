spring:
  cloud:
    function:
      definition: orderCreated
    stream:
      bindings:
        orderSuccess-in-0:
          destination: order-success
          group: notification-group
      kafka:
        binders:
          brokers: localhost:9092
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost

server:
  port: 8085

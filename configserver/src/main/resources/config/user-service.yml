server:
  port: 8082

spring:
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/userdb
  #   username: root
  #   password: password
  #
  # jpa:
  #   database: POSTGRESQL
  #   database-platform: org.hibernate.dialect.PostgreSQLDialect
  #   show-sql: true
  #   hibernate:
  #     ddl-auto: update

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://root:password@localhost:27018/userdb?authSource=admin}
      database: userdb

management:
  endpoints:
    web:
      exposure:
        include: "*"
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7
  # level:
  #   root: INFO
  #   com.ecommerce.user: TRACE

keycloak:
  admin:
    username: ${KEYCLOAK_ADMIN_USER:user}
    password: ${KEYCLOAK_ADMIN_PASS:user}
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8443}
    realm: ${KEYCLOAK_REALM:ecom-app}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    client-uuid: ${KEYCLOAK_CLIENT_UUID:3220fa53-994e-48f9-a27b-3ae2f46bc084}

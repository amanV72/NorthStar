spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost/realms/ecom-app}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/ecom-app/protocol/openid-connect/certs}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - http://localhost:*
              - http://127.0.0.1:*
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
            allow-credentials: true
    loadbalancer:
      eager-load:
        enabled: true
        clients:
          - product-service
          - user-service
          - order-service
          - cart-service
          - inventory-service
          - payment-service
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
server:
  port: 8080

#Circuit Breaker
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: count_based
        slowCallDurationThreshold: 4s
        slowCallRateThreshold: 80
    instances:
      productBreaker:
        baseConfig: default
      userBreaker:
        baseConfig: default
      orderBreaker:
        baseConfig: default
      cartBreaker:
        baseConfig: default
      paymentBreaker:
        baseConfig: default
      inventoryBreaker:
        baseConfig: default


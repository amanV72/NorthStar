name: ecom-application

x-container-defaults: &container-defaults
  restart: unless-stopped
  networks:
    - backend
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-java-service-defaults: &java-service-defaults
  <<: *container-defaults

services:
  postgres:
    <<: *container-defaults
    image: postgres:14
    container_name: postgres-ecom
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /data/postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/data/postgres
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    <<: *container-defaults
    image: dpage/pgadmin4
    container_name: pgadmin-ecom
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  mongodb:
    <<: *container-defaults
    image: mongo:8.0
    container_name: mongodb-ecom
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *container-defaults
    image: redis:7.4-alpine
    container_name: redis-ecom
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ecom:
    <<: *container-defaults
    image: apache/kafka:3.9.1
    container_name: kafka-ecom
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT},PLAINTEXT_INTERNAL://kafka-ecom:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  keycloak:
    <<: *container-defaults
    image: quay.io/keycloak/keycloak:26.4.7
    container_name: keycloak-ecom
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASS}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak-backups/realm-export-ecom-app.json:/opt/keycloak/data/import/ecom-app-realm.json:ro

  eureka-server:
    <<: *java-service-defaults
    image: ${IMAGE_PREFIX}/eureka-server:${IMAGE_TAG}
    container_name: eureka-server
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE_DIR: EurekaServer
    ports:
      - "${EUREKA_PORT}:8761"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 15

  configserver:
    <<: *java-service-defaults
    image: ${IMAGE_PREFIX}/configserver:${IMAGE_TAG}
    container_name: configserver
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE_DIR: configserver
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: classpath:/config
    ports:
      - "${CONFIG_SERVER_PORT}:8888"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 15

  product-service:
    <<: *java-service-defaults
    image: ${IMAGE_PREFIX}/product-service:${IMAGE_TAG}
    container_name: product-service
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE_DIR: product
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka-ecom:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    volumes:
      - product_uploads:/app/uploads
    depends_on:
      configserver:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-ecom:
        condition: service_healthy

  user-service:
    <<: *java-service-defaults
    image: ${IMAGE_PREFIX}/user-service:${IMAGE_TAG}
    container_name: user-service
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE_DIR: user
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8888
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASS: ${KEYCLOAK_ADMIN_PASS}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_CLIENT_UUID: ${KEYCLOAK_CLIENT_UUID}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      configserver:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_started

  cart-service:
    <<: *java-service-defaults
    image: ${IMAGE_PREFIX}/cart-service:${IMAGE_TAG}
    container_name: cart-service
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE_DIR: cart
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cart
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      configserver:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  inventory-service:
    <<: *java-service-defaults
    image: ${IMAGE_PREFIX}/inventory-service:${IMAGE_TAG}
    container_name: inventory-service
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE_DIR: inventory
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka-ecom:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      configserver:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-ecom:
        condition: service_healthy

  order-service:
    <<: *java-service-defaults
    image: ${IMAGE_PREFIX}/order-service:${IMAGE_TAG}
    container_name: order-service
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE_DIR: order
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka-ecom:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      configserver:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-ecom:
        condition: service_healthy

  payment-service:
    <<: *java-service-defaults
    image: ${IMAGE_PREFIX}/payment-service:${IMAGE_TAG}
    container_name: payment-service
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE_DIR: payment
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka-ecom:29092
      RAZORPAY_API_KEY: ${RAZORPAY_API_KEY}
      RAZORPAY_API_SECRET: ${RAZORPAY_API_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      configserver:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-ecom:
        condition: service_healthy

  gateway:
    <<: *java-service-defaults
    image: ${IMAGE_PREFIX}/gateway:${IMAGE_TAG}
    container_name: gateway
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE_DIR: gateway
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8888
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      APP_SECURITY_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    ports:
      - "${GATEWAY_PORT}:8080"
    depends_on:
      configserver:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started

  loki:
    <<: *container-defaults
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - ./evaluate-loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - observability

  grafana:
    <<: *container-defaults
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./evaluate-loki/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - observability

  alloy:
    <<: *container-defaults
    image: grafana/alloy:latest
    container_name: alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "${ALLOY_PORT}:12345"
    volumes:
      - ./evaluate-loki/alloy-local-config.yaml:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/logs-parent:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - observability

networks:
  backend:
    driver: bridge
  observability:
    driver: bridge

volumes:
  alloy_data:
  grafana_data:
  kafka_data:
  keycloak_data:
  loki_data:
  mongo_data:
  pgadmin_data:
  postgres_data:
  product_uploads:

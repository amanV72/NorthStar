spring.application.name=user-service
spring.config.import=optional:configserver:http://localhost:8888

server.port=8082

spring.data.mongodb.uri=${MONGO_URI:mongodb://root:password@localhost:27018/userdb?authSource=admin}
spring.data.mongodb.database=userdb

keycloak.admin.username=${KEYCLOAK_ADMIN_USER:user}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASS:user}
keycloak.admin.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8443}
keycloak.admin.realm=${KEYCLOAK_REALM:ecom-app}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
keycloak.admin.client-uuid=${KEYCLOAK_CLIENT_UUID:3220fa53-994e-48f9-a27b-3ae2f46bc084}


